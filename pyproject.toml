[project]
name = "modular-discord-dashboard-bot"
version = "0.1.0"
description = "Self-hostable modular Discord bot with a FastAPI/React dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Contributors" }]
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "authlib>=1.3.2",
  "discord.py>=2.4.0,<3.0.0",
  "fastapi>=0.115.6",
  "greenlet>=3.1.1",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "orjson>=3.10.12",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.1",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.36",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app", "core"]
